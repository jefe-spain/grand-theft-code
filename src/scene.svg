<!--
  Grand Theft Code background scene.

  Open this file in a browser to watch it on its own. Sizes use vw and vh so the
  scene follows the chat area. The sky gradient, grid lines and striped sun are
  CSS layers in theme.css, not part of this file.

  The build joins the lines (leading whitespace is dropped, nothing is added
  between lines), removes comment lines and escapes each hash so the result fits
  in a CSS url(). Keep every tag on one line and use single quotes only.
  Lines between the logo markers are left out of the Clean variant.
-->
<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%'>
  <style>
    /* cl clouds; each cloud sets its height with the y custom property */
    .cl{animation:cl 180s linear infinite}
    @keyframes cl{from{translate:-400px var(--y)}to{translate:calc(100vw + 400px) var(--y)}}
    /* sp star twinkle */
    .sp{animation:sp 4.5s ease-in-out infinite alternate}
    @keyframes sp{from{scale:.3;opacity:.1}to{scale:1;opacity:.7}}
    /* sh shooting star */
    .sh{animation:sh 24s linear infinite}
    @keyframes sh{0%{translate:72vw 5vh;opacity:0}1.5%{opacity:.8}5%{translate:50vw 24vh;opacity:0}to{translate:50vw 24vh;opacity:0}}
    /* pl plane */
    .pl{animation:pl 75s linear infinite;animation-delay:-12s}
    @keyframes pl{from{translate:-140px 40vh}60%{translate:calc(100vw + 140px) calc(40vh - 10.5vw)}to{translate:calc(100vw + 140px) calc(40vh - 10.5vw)}}
    /* pt trunk sway, pc crown sway */
    .pt{animation:pt 7s ease-in-out infinite alternate}
    @keyframes pt{from{rotate:-1.2deg}to{rotate:1.5deg}}
    .pc{animation:pc 3.6s ease-in-out infinite alternate}
    @keyframes pc{from{rotate:-4deg}to{rotate:3deg}}
    /* logo */
    /* vb badge float, vs shine sweep */
    .vb{animation:vb 6s ease-in-out infinite alternate}
    @keyframes vb{from{translate:0 -5px}to{translate:0 5px}}
    .vs{animation:vs 7s ease-in-out infinite}
    @keyframes vs{0%{translate:-160px 0}30%,100%{translate:480px 0}}
    /* /logo */
    /* Without motion: park the clouds in the sky and hide what only makes sense while moving */
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.cl{translate:calc(var(--y)*3 + 14vw) var(--y)}.pl,.sh{display:none}}
  </style>
  <defs>
    <!-- Four-point star -->
    <path id='s' d='M0-7L1.8-1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8-1.8z'/>
    <!-- Cloud made of three rounded bars -->
    <g id='cd'>
      <rect x='-90' width='180' height='9' rx='4.5'/>
      <rect x='-60' y='-13' width='150' height='9' rx='4.5'/>
      <rect x='-120' y='13' width='130' height='9' rx='4.5'/>
    </g>
    <!-- Contrail fade -->
    <linearGradient id='ct'>
      <stop offset='0' stop-color='#fff' stop-opacity='0'/>
      <stop offset='1' stop-color='#fff' stop-opacity='.85'/>
    </linearGradient>
    <!-- Palm parts: tk trunk, fr one frond, cr full crown with coconuts -->
    <path id='tk' d='M-10 0C-6-90 4-180 20-250L28-248C14-178 6-90 10 0z'/>
    <path id='fr' d='M0 0C30-24 82-22 120 18L110 13 106 30 98 6 92 24 84 0 77 18 70-4 62 13 55-8 47 8 40-8 32 6 25-6 17 3 10-2z'/>
    <g id='cr'>
      <use href='#fr'/>
      <use href='#fr' transform='rotate(-38) scale(.85)'/>
      <use href='#fr' transform='rotate(24) scale(.9)'/>
      <use href='#fr' transform='scale(-1 1)'/>
      <use href='#fr' transform='scale(-1 1) rotate(-38) scale(.85)'/>
      <use href='#fr' transform='scale(-1 1) rotate(26) scale(.85)'/>
      <use href='#fr' transform='rotate(-78) scale(.6)'/>
      <circle cx='-5' cy='8' r='5'/>
      <circle cx='5' cy='9' r='5'/>
      <circle cx='0' cy='3' r='5'/>
    </g>
    <!-- Palm crown and trunk gradients -->
    <linearGradient id='pf'>
      <stop offset='0' stop-color='#4a1a8c'/>
      <stop offset='1' stop-color='#d4157f'/>
    </linearGradient>
    <linearGradient id='pk' x1='0' y1='1' x2='0' y2='0'>
      <stop offset='0' stop-color='#2e0f5e'/>
      <stop offset='1' stop-color='#4a1a8c'/>
    </linearGradient>
    <!-- logo -->
    <!-- The letters V and I, 293 x 200 units -->
    <path id='vi' d='M0 0H74L107.5 78L141 0H215L129 200H86ZM223 0H293V200H223Z'/>
    <clipPath id='vc'>
      <use href='#vi'/>
    </clipPath>
    <!-- Wordmark: three lines of Pricedown Black converted to outlines -->
    <path id='wm' d='
      M77.9 84.3C82.8 84.3 85.4 82.5 85.4 78.6V24H59.2C54.2 24 51.7 25.9 51.7 29.8V64.3C51.7 68.1 54.2 70 59.2 70H70.4V72.7C70.4 72.8 70.3 72.9 70.2 72.9H51.7V84.3Z
      M70.4 58.6H66.8C66.8 58.6 66.7 58.5 66.7 58.4V35.7C66.7 35.6 66.8 35.5 66.8 35.5H70.4Z
      M121.7 70V50.8C121.7 48.5 120.5 47.3 118 47C120.4 46.7 121.6 45.4 121.6 43.2V29.8C121.6 25.9 119.2 24 114.2 24H88.1V70H103.1V51.6H106.6C106.7 51.6 106.7 51.6 106.7 51.7V70Z
      M106.7 42.3C106.7 42.4 106.7 42.4 106.6 42.4H103.1V35.5H106.6C106.7 35.5 106.7 35.6 106.7 35.7Z
      M142.9 58.6H139.4C139.3 58.6 139.2 58.5 139.2 58.4V51.5C139.2 51.4 139.3 51.4 139.4 51.4H142.9Z
      M157.9 70V29.8C157.9 25.9 155.3 24 150.4 24H131.7C126.8 24 124.2 25.9 124.2 29.8V38.3H139.2V35.7C139.2 35.6 139.3 35.5 139.4 35.5H142.7C142.8 35.5 142.9 35.6 142.9 35.7V41.3H131.7C126.8 41.3 124.2 43.1 124.2 47V64.3C124.2 68.1 126.8 70 131.7 70Z
      M194.1 70V29.8C194.1 25.9 191.6 24 186.7 24C181.8 24 178 25 175.5 26.9V24H160.5V70H175.5V35.7C175.5 35.6 175.6 35.5 175.6 35.5H179C179.1 35.5 179.2 35.6 179.2 35.7V70Z
      M230.3 70V12.5H215.3V24H204.2C199.2 24 196.7 25.9 196.7 29.8V64.3C196.7 68.1 199 70 204.2 70Z
      M215.3 58.6H211.8C211.7 58.6 211.6 58.5 211.6 58.4V35.7C211.6 35.6 211.7 35.5 211.8 35.5H215.3Z
      M99.3 120C103.8 120 106.1 118.3 106.1 114.9V94.1H92.6V109.5C92.6 109.6 92.5 109.7 92.5 109.7H89.4C89.3 109.7 89.2 109.6 89.2 109.5V91.4H106.1V81.1H89.2V78.5H75.7V81.1H72.4V91.4H75.7V114.9C75.7 118.3 78 120 82.5 120Z
      M138.8 120V83.7C138.8 80.2 136.5 78.5 132.1 78.5H122V68.1H108.5V120H122V88.9H125.2C125.2 88.9 125.3 88.9 125.3 89V120Z
      M157.9 94.8H154.6V89C154.6 88.9 154.7 88.9 154.7 88.9H157.8C157.9 88.9 157.9 88.9 157.9 89Z
      M164.7 120C169.2 120 171.4 118.3 171.4 114.9V107.1H157.9V109.5C157.9 109.6 157.9 109.7 157.8 109.7H154.7C154.7 109.7 154.6 109.6 154.6 109.5V104.5H171.4V83.7C171.4 80.2 169.2 78.5 164.7 78.5H147.9C143.4 78.5 141.1 80.2 141.1 83.7V114.9C141.1 118.3 143.4 120 147.9 120Z
      M187.2 120V101.8H198.9V91.4H187.2V89C187.2 88.9 187.3 88.9 187.4 88.9H199.1V78.5H180.5C176 78.5 173.7 80.3 173.7 83.7V120Z
      M226.4 120C230.9 120 233.2 118.3 233.2 114.9V94.1H219.7V109.5C219.7 109.6 219.7 109.7 219.6 109.7H216.5C216.4 109.7 216.4 109.6 216.4 109.5V91.4H233.2V81.1H216.4V78.5H202.8V81.1H199.5V91.4H202.8V114.9C202.8 118.3 205.1 120 209.6 120Z
      M97.2 170C101.6 170 103.9 168.3 103.9 164.9V149.8H90.4V159.5C90.4 159.6 90.3 159.7 90.3 159.7H87.2C87.1 159.7 87.1 159.6 87.1 159.5V139C87.1 138.9 87.1 138.9 87.2 138.9H90.3C90.3 138.9 90.4 138.9 90.4 139V146H103.9V133.7C103.9 130.2 101.6 128.5 97.2 128.5H80.3C75.8 128.5 73.6 130.2 73.6 133.7V164.9C73.6 168.3 75.8 170 80.3 170Z
      M123 159.5C123 159.6 122.9 159.7 122.8 159.7H119.8C119.7 159.7 119.6 159.6 119.6 159.5V139C119.6 138.9 119.7 138.9 119.8 138.9H122.8C122.9 138.9 123 138.9 123 139Z
      M129.7 170C134.2 170 136.5 168.3 136.5 164.9V133.7C136.5 130.2 134.2 128.5 129.7 128.5H112.9C108.4 128.5 106.1 130.2 106.1 133.7V164.9C106.1 168.3 108.4 170 112.9 170Z
      M169 170V118.1H155.5V128.5H145.4C141 128.5 138.7 130.2 138.7 133.7V164.9C138.7 168.3 140.8 170 145.4 170Z
      M155.5 159.7H152.3C152.3 159.7 152.2 159.6 152.2 159.5V139C152.2 138.9 152.3 138.9 152.3 138.9H155.5Z
      M188.2 144.8H184.9V139C184.9 138.9 185 138.9 185 138.9H188.1C188.2 138.9 188.2 138.9 188.2 139Z
      M195 170C199.5 170 201.7 168.3 201.7 164.9V157.1H188.2V159.5C188.2 159.6 188.2 159.7 188.1 159.7H185C185 159.7 184.9 159.6 184.9 159.5V154.5H201.7V133.7C201.7 130.2 199.5 128.5 195 128.5H178.1C173.7 128.5 171.4 130.2 171.4 133.7V164.9C171.4 168.3 173.7 170 178.1 170Z
    '/>
    <!-- Badge fill: blue, violet, magenta, orange, yellow on a diagonal -->
    <linearGradient id='vg' gradientUnits='userSpaceOnUse' x1='10' y1='0' x2='250' y2='210'>
      <stop offset='0' stop-color='#2f7de8'/>
      <stop offset='.22' stop-color='#6a5ae6'/>
      <stop offset='.45' stop-color='#c64bd8'/>
      <stop offset='.62' stop-color='#ff4f9e'/>
      <stop offset='.82' stop-color='#ff8552'/>
      <stop offset='1' stop-color='#ffc65a'/>
    </linearGradient>
    <!-- White band for the shine sweep -->
    <linearGradient id='vw'>
      <stop offset='0' stop-color='#fff' stop-opacity='0'/>
      <stop offset='.5' stop-color='#fff' stop-opacity='.7'/>
      <stop offset='1' stop-color='#fff' stop-opacity='0'/>
    </linearGradient>
  <!-- /logo -->
  </defs>
  <!-- Twinkling stars -->
  <use href='#s' class='sp' fill='#ff2e97' style='translate:60vw 39vh;animation-delay:-5.9s'/>
  <use href='#s' class='sp' fill='#00c8f0' style='translate:60vw 36vh;animation-delay:-7.5s'/>
  <use href='#s' class='sp' fill='#8a3ffc' style='translate:27vw 15vh;animation-delay:-6.5s'/>
  <use href='#s' class='sp' fill='#ff2e97' style='translate:63vw 44vh;animation-delay:-7.8s'/>
  <use href='#s' class='sp' fill='#00c8f0' style='translate:26vw 10vh;animation-delay:-5.7s'/>
  <use href='#s' class='sp' fill='#8a3ffc' style='translate:41vw 13vh;animation-delay:-1.1s'/>
  <use href='#s' class='sp' fill='#ff2e97' style='translate:71vw 44vh;animation-delay:-0.5s'/>
  <use href='#s' class='sp' fill='#00c8f0' style='translate:79vw 29vh;animation-delay:-5.7s'/>
  <use href='#s' class='sp' fill='#8a3ffc' style='translate:86vw 43vh;animation-delay:-8.3s'/>
  <use href='#s' class='sp' fill='#ff2e97' style='translate:23vw 43vh;animation-delay:-0.1s'/>
  <use href='#s' class='sp' fill='#00c8f0' style='translate:70vw 8vh;animation-delay:-0.7s'/>
  <use href='#s' class='sp' fill='#8a3ffc' style='translate:7vw 16vh;animation-delay:-3.0s'/>
  <!-- Clouds drifting left to right -->
  <g fill='#fff' opacity='.6'>
    <use href='#cd' class='cl' style='--y:11vh;animation-delay:-35s'/>
    <use href='#cd' class='cl' style='--y:26vh;animation-delay:-100s'/>
    <use href='#cd' class='cl' style='--y:18vh;animation-delay:-155s'/>
  </g>
  <!-- logo -->
  <!-- VI badge: purple halo, gradient letters, palms clipped inside, shine sweep, outlined wordmark -->
  <svg x='1.5%' y='3%' width='22%' height='42%' viewBox='-16 -16 325 236' preserveAspectRatio='xMinYMin meet' overflow='visible'>
    <g class='vb'>
      <g stroke-linejoin='round'>
        <use href='#vi' fill='#a23be0' stroke='#a23be0' stroke-width='17'/>
        <use href='#vi' fill='url(#vg)' stroke='#21093a' stroke-width='11' paint-order='stroke'/>
      </g>
      <g clip-path='url(#vc)'>
        <g fill='#ffb3ec' opacity='.5'>
          <g style='translate:26px 200px;scale:.62'>
            <g class='pt' style='animation-delay:-2s'>
              <use href='#tk'/>
              <g class='pc' style='translate:24px -250px;animation-delay:-1s'>
                <use href='#cr'/>
              </g>
            </g>
          </g>
          <g style='translate:196px 215px;scale:-.7 .7'>
            <g class='pt' style='animation-delay:-5s'>
              <use href='#tk'/>
              <g class='pc' style='translate:24px -250px;animation-delay:-3s'>
                <use href='#cr'/>
              </g>
            </g>
          </g>
        </g>
        <g fill='#ff8fd6' opacity='.6'>
          <g style='translate:262px 230px;scale:.78'>
            <g class='pt' style='animation-delay:-3.5s'>
              <use href='#tk'/>
              <g class='pc' style='translate:24px -250px;animation-delay:-2.2s'>
                <use href='#cr'/>
              </g>
            </g>
          </g>
        </g>
        <g fill='#5a1a8a' opacity='.5'>
          <g style='translate:292px 215px;scale:-.4 .4'>
            <g class='pt' style='animation-delay:-1s'>
              <use href='#tk'/>
              <g class='pc' style='translate:24px -250px;animation-delay:-4s'>
                <use href='#cr'/>
              </g>
            </g>
          </g>
        </g>
        <rect class='vs' x='-40' y='-20' width='70' height='260' fill='url(#vw)' transform='skewX(-18)'/>
      </g>
      <g stroke-linejoin='round'>
        <use href='#wm' fill='#b53be6' stroke='#b53be6' stroke-width='12.5'/>
        <use href='#wm' fill='#fff' stroke='#120620' stroke-width='7' paint-order='stroke'/>
      </g>
    </g>
  </svg>
  <!-- /logo -->
  <!-- Three palms anchored to the bottom-left corner: cyan offset shadow, trunk, swaying crown -->
  <g style='translate:4vw calc(100vh + 8px);scale:-1.1 1.1'>
    <g class='pt' style='animation-delay:-1s'>
      <g fill='#00d5ff' opacity='.45' transform='translate(6 3)'>
        <use href='#tk'/>
        <g class='pc' style='translate:24px -250px;animation-delay:-.5s'>
          <use href='#cr'/>
        </g>
      </g>
      <use href='#tk' fill='url(#pk)'/>
      <path d='M0 0C0-90 9-179 24-249' fill='none' stroke='#ff9ccf' stroke-opacity='.35' stroke-width='7' stroke-dasharray='2 16'/>
      <g class='pc' style='translate:24px -250px;animation-delay:-.5s'>
        <use href='#cr' fill='url(#pf)'/>
      </g>
    </g>
  </g>
  <g style='translate:8vw calc(100vh + 8px);scale:1.25 1.25'>
    <g class='pt' style='animation-delay:-4s'>
      <g fill='#00d5ff' opacity='.45' transform='translate(6 3)'>
        <use href='#tk'/>
        <g class='pc' style='translate:24px -250px;animation-delay:-2s'>
          <use href='#cr'/>
        </g>
      </g>
      <use href='#tk' fill='url(#pk)'/>
      <path d='M0 0C0-90 9-179 24-249' fill='none' stroke='#ff9ccf' stroke-opacity='.35' stroke-width='7' stroke-dasharray='2 16'/>
      <g class='pc' style='translate:24px -250px;animation-delay:-2s'>
        <use href='#cr' fill='url(#pf)'/>
      </g>
    </g>
  </g>
  <g style='translate:17vw calc(100vh + 8px);scale:.75 .75'>
    <g class='pt' style='animation-delay:-2.5s'>
      <g fill='#00d5ff' opacity='.45' transform='translate(6 3)'>
        <use href='#tk'/>
        <g class='pc' style='translate:24px -250px;animation-delay:-1.2s'>
          <use href='#cr'/>
        </g>
      </g>
      <use href='#tk' fill='url(#pk)'/>
      <path d='M0 0C0-90 9-179 24-249' fill='none' stroke='#ff9ccf' stroke-opacity='.35' stroke-width='7' stroke-dasharray='2 16'/>
      <g class='pc' style='translate:24px -250px;animation-delay:-1.2s'>
        <use href='#cr' fill='url(#pf)'/>
      </g>
    </g>
  </g>
  <!-- Plane with contrail -->
  <g class='pl'>
    <g transform='rotate(-6)'>
      <rect x='-120' y='-1.2' width='104' height='2.4' rx='1.2' fill='url(#ct)'/>
      <path d='M-16 0q0-3 4-3h20q8 0 10 3q-2 3-10 3h-20q-4 0-4-3zM-14-2l-4-8h4l6 8zM1 1l-8 9h4l12-9z' fill='#8a3ffc' opacity='.75'/>
    </g>
  </g>
  <!-- Shooting star -->
  <path class='sh' d='M0 0l40-27' stroke='#00d5ff' stroke-width='2' stroke-linecap='round'/>
</svg>
