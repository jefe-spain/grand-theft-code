name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Built themes match the sources and fit T3 Code's limits
        run: python3 build.py --check
      - name: Animated mock-up matches the sources
        run: python3 tools/mockup.py --check
